<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../teacher_panel/teacher_panel.css">
    <link rel="stylesheet" href="../styles/mystyle2.css">
</head>
<div class="admin-container">
    <aside class="admin-sidebar">
        <div id="global-nav"></div>
    </aside>

    <main class="admin-main">
    <header class="admin-header">
        <h1>Teacher Panel</h1>
        <p>Changes made here will update the student view.</p>
        
        <!-- KARTA 1: Twój stary element wyboru ucznia (Zaktualizowany) + Nowa stawka -->
        <section class="cacti-card student-profile">
            <h2 class="card-title">Zarządzanie Uczniem</h2>
            
            <div class="form-group">
                <!-- Tu integrujemy Twój stary mechanizm wyboru -->
                <label for="student-select">Wybierz ucznia:</label>
                <select id="student-select" class="clean-input">
                    <!-- Opcje ładowane z Supabase -->
                </select>
            </div>

            <div class="form-group mt-2">
                <label for="hourly-rate">Stawka godzinowa (PLN):</label>
                <div class="rate-input-group flex-between">
                    <input type="number" id="hourly-rate" class="clean-input" placeholder="np. 60">
                    <button id="save-rate-btn" class="btn-primary">Zapisz</button>
                </div>
            </div>
        </section>

        <!-- KARTA 2: Tabela obecności (Nowa funkcja) -->
        <section class="cacti-card attendance-tracker">
            <div class="card-header flex-between">
                <h2 class="card-title">Obecność</h2>
                <input type="month" id="month-selector" class="clean-input">
            </div>
            
            <table class="clean-table full-width mt-2">
                <!-- Struktura tabeli pozostaje bez zmian -->
            </table>
        </section>

        <!-- KARTA 3: Twoje stare notatki (Zaktualizowane i przypisane do zajęć) -->
        <section class="cacti-card class-notes">
            <h2 class="card-title">Notatki z zajęć</h2>
            <!-- Tu integrujemy Twoje obecne pole tekstowe -->
            <textarea id="class-note-input" class="clean-input mt-2" rows="6" placeholder="Wprowadź notatki dla wybranych zajęć..."></textarea>
            <button id="save-note-btn" class="btn-primary mt-2">Zapisz notatkę</button>
        </section>
</main>
        <div class="admin-card">
    <h3>📦 Bulk Data Import</h3>
    <p>Update your data quickly by uploading your latest CSV spreadsheet.</p>
    <a href="../teacher_panel/import.html" class="btn-primary" style="display: inline-block; text-align: center; text-decoration: none; box-sizing: border-box;">
        Open Importer →
    </a>
</div>
    </main>
</div>
