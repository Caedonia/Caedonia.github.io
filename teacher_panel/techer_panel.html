<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../teacher_panel/teacher_panel.css">
    <link rel="stylesheet" href="../styles/mystyle2.css">
</head>
<body>
    <div class="admin-container">
        
        <!-- 1. Pasek Boczny -->
        <aside class="admin-sidebar">
            <div id="global-nav"></div>
        </aside>

        <!-- 2. GŁÓWNA ZAWARTOŚĆ - Tutaj dodajemy brakujący tag <main>! -->
        <main class="admin-main">
            
            <!-- 3. Nasz układ wymuszający pion (column) -->
            <div class="dashboard-container">
                
                <!-- Nagłówek -->
                <header class="panel-header">
                    <h1>Panel Nauczyciela</h1>
                    <div class="student-selector">
                        <label for="student-select">Uczeń:</label>
                        <select id="student-select" class="cacti-input">
                            <option value="1">Jan Kowalski (Poziom: B1)</option>
                            <option value="2">Anna Nowak (Poziom: C1)</option>
                        </select>
                    </div>
                </header>

                <!-- Karta 1: Harmonogram -->
                <section class="admin-card schedule-card">
                    <h2>Harmonogram i Obecność</h2>
    
                    <!-- NOWY KONTENER: Trzyma czas i stawkę w jednej linii -->
                    <div class="lesson-details-header">
                        <p class="schedule-time"><strong>Zajęcia:</strong> Wtorek, 17:00 - 18:00</p>
        
                        <!-- Pole edycji stawki -->
                        <div class="rate-editor">
                        <label for="hourly-rate">Stawka:</label>
                            <div class="rate-input-wrapper">
                            <input type="number" id="hourly-rate" class="cacti-input rate-input" value="60" min="0" step="5">
                            <span class="currency">zł/h</span>
                            </div>
                        </div>
                    </div>

    <!-- Poniżej zostaje Twoja siatka obecności -->
    <div class="attendance-grid">
        <div class="day present">12.10 (Obecność)</div>
        <div class="day absent">19.10 (Brak)</div>
    </div>
</section>

                <!-- Karta 2: Tracker obecności -->
                <section class="admin-card attendance-tracker">
                    <div class="card-header global-controls">
                        <h2>Miesięczna Obecność</h2>
                        <input type="month" id="month-selector" class="cacti-input">
                    </div>
                    <table class="admin-table">
                        <!-- Miejsce na generowaną tabelę -->
                    </table>
                </section>

                <!-- Karta 3: Notatki z zajęć -->
                <section class="admin-card notes-card">
                    <h2>Notatki z zajęć</h2>
                    <form id="note-form">
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label for="lesson-date">Data lekcji:</label>
                            <input type="date" id="lesson-date" class="cacti-input" required>
                        </div>
                        <div class="form-group" style="margin-bottom: 15px;">
                            <textarea id="lesson-note" class="cacti-input" placeholder="Wpisz nowe słownictwo, problemy z gramatyką..." rows="5" required></textarea>
                        </div>
                        <button type="submit" class="admin-btn">Zapisz notatkę</button>
                    </form>
                </section>

                <!-- Karta 4: Import Danych -->
                <section class="admin-card">
                    <h3>📦 Bulk Data Import</h3>
                    <p>Update your data quickly by uploading your latest CSV spreadsheet.</p>
                    <a href="../teacher_panel/import.html" class="admin-btn">Open Importer →</a>
                </section>

            </div> <!-- Koniec dashboard-container -->
        </main> <!-- Koniec admin-main -->
    </div> <!-- Koniec admin-container -->

    <script src="../JS/nav.js"></script>
    <script src="../teacher_panel/teacher_panel.js"></script>
</body>
