<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../teacher_panel/teacher_panel.css">
    <link rel="stylesheet" href="../styles/mystyle2.css">
</head>
<body>
    <div class="admin-container">
        
        <!-- 1. Pasek Boczny -->
        <aside class="admin-sidebar">
            <div id="global-nav"></div>
        </aside>

        <!-- 2. GŁÓWNA ZAWARTOŚĆ - Tutaj dodajemy brakujący tag <main>! -->
        <main class="admin-main">
            
                <div class="dashboard-container">
                
                <!-- Nagłówek -->
                <header class="panel-header">
            <h1>Panel Nauczyciela</h1>
    
            <!-- Nowy kontener na kontrolki -->
            <div class="global-controls">
                <div class="student-selector">
                    <label for="student-select">Uczeń:</label>
                    <select id="student-select" class="cacti-input">
                        <option value="1">Jan Kowalski (Poziom: B1)</option>
                    </select>
                </div>
                <!-- Nasz nowy przycisk -->
                <button id="open-modal-btn" class="admin-btn">+ Nowy Uczeń</button>
            </div>
        </header>

                <!-- Karta 1: Harmonogram -->
                <section class="admin-card schedule-card">
                    <h2>Harmonogram i Obecność</h2>
    
                    <!-- NOWY KONTENER: Trzyma czas i stawkę w jednej linii -->
                    <div class="lesson-details-header">
                        <p class="schedule-time"><strong>Zajęcia:</strong> Wtorek, 17:00 - 18:00</p>
        
                        <!-- Pole edycji stawki -->
                        <div class="rate-editor">
                        <label for="hourly-rate">Stawka:</label>
                            <div class="rate-input-wrapper">
                            <input type="number" id="hourly-rate" class="cacti-input rate-input" value="60" min="0" step="5">
                            <span class="currency">zł/h</span>
                            </div>
                        </div>
                    </div>

    <!-- Poniżej zostaje Twoja siatka obecności -->
    <div class="attendance-grid">
        <div class="day present">12.10 (Obecność)</div>
        <div class="day absent">19.10 (Brak)</div>
    </div>
</section>

                <!-- Karta 2: Tracker obecności -->
                <section class="admin-card attendance-tracker">
                    <div class="card-header global-controls">
                        <h2>Miesięczna Obecność</h2>
                        <input type="month" id="month-selector" class="cacti-input">
                    </div>
                    <table class="admin-table">
                        <!-- Miejsce na generowaną tabelę -->
                    </table>
                </section>

                <!-- Karta 3: Notatki z zajęć -->
                <section class="admin-card notes-card">
                    <h2>Notatki z zajęć</h2>
                    <form id="note-form">
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label for="lesson-date">Data lekcji:</label>
                            <input type="date" id="lesson-date" class="cacti-input" required>
                        </div>
                        <div class="form-group" style="margin-bottom: 15px;">
                            <textarea id="lesson-note" class="cacti-input" placeholder="Wpisz nowe słownictwo, problemy z gramatyką..." rows="5" required></textarea>
                        </div>
                        <button type="submit" class="admin-btn">Zapisz notatkę</button>
                    </form>
                </section>

                <!-- Karta 4: Import Danych -->
                <section class="admin-card">
                    <h3>📦 Bulk Data Import</h3>
                    <p>Update your data quickly by uploading your latest CSV spreadsheet.</p>
                    <a href="../teacher_panel/import.html" class="admin-btn">Open Importer →</a>
                </section>

            </div> <!-- Koniec dashboard-container -->
        </main> <!-- Koniec admin-main -->
    </div> <!-- Koniec admin-container -->
    <!-- SZKLARNIA: Modal dodawania ucznia -->
        <div id="add-student-modal" class="cacti-modal hidden">
        <!-- Używamy Twojej klasy admin-card jako bazy dla okienka -->
            <div class="modal-content admin-card">
        
                <div class="modal-header">
                    <h2>Katalogowanie nowego ucznia</h2>
                    <button id="close-modal-btn" class="close-btn">&times;</button>
                </div>

                <form id="new-student-form">
                    <!-- Siatka formularza -->
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="new-name">Imię:</label>
                            <input type="text" id="new-name" class="cacti-input" required>
                        </div>
                
                        <div class="form-group">
                            <label for="new-surname">Nazwisko:</label>
                            <input type="text" id="new-surname" class="cacti-input" required>
                        </div>

                    <div class="form-group">
                            <label for="new-time">Czas zajęć (np. Wt 17:00):</label>
                            <input type="text" id="new-time" class="cacti-input" required>
                    </div>

                        <div class="form-group">
                            <label for="new-rate">Stawka wyjściowa (zł):</label>
                            <input type="number" id="new-rate" class="cacti-input" value="60" min="0" step="5" required>
                        </div>

                        <div class="form-group">
                            <label for="new-book">Podręcznik / Materiały:</label>
                            <input type="text" id="new-book" class="cacti-input" placeholder="Np. English File B1">
                        </div>

                        <div class="form-group">
                            <label for="new-level">Klasa / Poziom (Taksonomia):</label>
                            <input type="text" id="level-class" class="cacti-input" placeholder="Np. Klasa 7">
                        </div>
                    </div>

                    <!-- Przycisk zapisu na pełną szerokość -->
                    <button type="submit" class="admin-btn full-width" style="margin-top: 20px;">
                Zasadź w bazie (Dodaj)
                    </button>
                </form>
            </div>
        </div>
    <script src="../JS/nav.js"></script>
    <script src="../teacher_panel/teacher_panel.js"></script>
</body>
